<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Proposta Comercial — Aqui ads</title>

  <!-- Google Fonts Oficiais do Manual de Marca Aqui ads: Atkinson Hyperlegible (UI/Tabelas/Números) + Rethink Sans (Display/Títulos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

  <!-- Unicons (Ícones Lineares Oficiais Aqui ads) -->
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">

  <!-- Leaflet CSS & JS para Mapa Interativo OOH -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SheetJS Styled (xlsx-js-style) para exportação de planilha Excel (.xlsx) estilizada com cores, bold, formatos de moeda e AutoFilter -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

  <!-- Tailwind CSS CDN Configurado com os Tokens do Manual de Marca Aqui ads + Nova Home + Figma Payment -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Atkinson Hyperlegible"', '"Rethink Sans"', 'sans-serif'],
            display: ['"Rethink Sans"', 'sans-serif']
          },
          colors: {
            primary: {
              DEFAULT: '#F15A22',
              hover: '#D54300',
              light: '#FFF3EA',
              border: '#FCD5B5'
            },
            aqui: {
              red: '#E83C39',
              orange: '#F15A22',
              amber: '#F7990F',
              green: '#1B5E20',
              greenLight: '#E8F5E9',
              paper: '#F9F5F0',
              ink: '#121212',
              ink2: '#56514B',
              ink3: '#8A837B'
            },
            ds: {
              bg: '#F9F5F0',
              surface: '#FBF8F4',
              border: '#ECE6DF',
              borderStrong: '#DFD7CE',
              text: '#121212',
              textMain: '#121212',
              textSecondary: '#56514B',
              muted: '#8A837B',
              textMuted: '#8A837B'
            }
          },
          boxShadow: {
            'aqui-card': '0 10px 30px -15px rgba(18, 18, 18, 0.06)',
            'aqui-cta': '0 8px 22px -10px rgba(241, 90, 34, 0.55)',
            'aqui-pill': '0 6px 16px -6px rgba(241, 90, 34, 0.45)'
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --paper: #F9F5F0;
      --white: #FFFFFF;
      --ink: #121212;
      --ink-2: #56514B;
      --ink-3: #8A837B;
      --line: rgba(18, 18, 18, 0.09);
      --red: #E83C39;
      --orange: #F15A22;
      --amber: #F7990F;
      --grad: linear-gradient(90deg, #E83C39 0%, #F15A22 40%, #F15A22 75%, #F7990F 100%);
    }

    *, *::before, *::after {
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0, "dlig" 0;
    }

    body {
      font-family: 'Atkinson Hyperlegible', 'Rethink Sans', sans-serif;
      background-color: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .font-display {
      font-family: 'Rethink Sans', sans-serif;
      letter-spacing: -0.02em;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0, "dlig" 0;
    }

    select, option {
      font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      font-variant-ligatures: none !important;
      font-feature-settings: "liga" 0, "calt" 0, "dlig" 0 !important;
    }

    /* Degradê Oficial Aqui ads (Botões Primários e Destaques) */
    .bg-aqui-grad {
      background: var(--grad);
      box-shadow: 0 8px 22px -10px rgba(241, 90, 34, 0.55);
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .bg-aqui-grad:hover {
      filter: brightness(1.03);
      box-shadow: 0 12px 26px -8px rgba(241, 90, 34, 0.68);
      transform: translateY(-1px);
    }

    .grad-text {
      background: linear-gradient(90deg, #E83C39 0%, #F15A22 45%, #F7990F 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Scrollbar sutil para listas com limite de 4 itens (Bounded Scroll) */
    .bounded-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .bounded-scroll::-webkit-scrollbar-track {
      background: #F9F5F0;
      border-radius: 9999px;
    }
    .bounded-scroll::-webkit-scrollbar-thumb {
      background: #D6CEC2;
      border-radius: 9999px;
    }
    .bounded-scroll::-webkit-scrollbar-thumb:hover {
      background: #B8AEA0;
    }

    /* Simulador Mobile (390px reais de área útil interna + tela de celular limitada com scroll interno) */
    .mobile-simulator-wrapper {
      width: 100% !important;
      max-width: 412px !important;
      height: min(812px, calc(100vh - 68px)) !important;
      max-height: min(812px, calc(100vh - 68px)) !important;
      flex: 0 0 auto !important;
      margin: 12px auto !important;
      border: 8px solid #CBD5E1;
      border-radius: 32px;
      box-shadow: 0 20px 40px -15px rgba(18, 18, 18, 0.18);
      overflow-x: hidden !important;
      overflow-y: auto !important;
      background: #F9F5F0;
      box-sizing: border-box;
      position: relative;
      scroll-behavior: smooth;
    }
    .mobile-simulator-wrapper > header {
      top: 0 !important;
    }
    .mobile-simulator-wrapper::-webkit-scrollbar {
      width: 6px;
    }
    .mobile-simulator-wrapper::-webkit-scrollbar-track {
      background: #F3ECE4;
      border-radius: 9999px;
    }
    .mobile-simulator-wrapper::-webkit-scrollbar-thumb {
      background: #C8BFB3;
      border-radius: 9999px;
    }
    .mobile-simulator-wrapper::-webkit-scrollbar-thumb:hover {
      background: #A89E90;
    }
    @media screen and (max-width: 440px) {
      .mobile-simulator-wrapper {
        margin: 0 auto !important;
        border-width: 0 !important;
        border-radius: 0 !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: none !important;
        overflow-y: visible !important;
      }
    }
    .mobile-simulator-wrapper .sim-grid-1 {
      grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
    }
    .mobile-simulator-wrapper .sim-grid-1 > * {
      grid-column: 1 / -1 !important;
    }
    .mobile-simulator-wrapper .sim-grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    }
    .mobile-simulator-wrapper .sim-hide-mobile {
      display: none !important;
    }
    .mobile-simulator-wrapper .sim-show-mobile {
      display: flex !important;
    }
    .mobile-simulator-wrapper .sim-show-block-mobile {
      display: block !important;
    }
    .mobile-simulator-wrapper .sim-stack-mobile {
      flex-direction: column !important;
      align-items: flex-start !important;
    }
    .mobile-simulator-wrapper .sim-unsticky-mobile {
      position: static !important;
    }
    .mobile-simulator-wrapper #journeyStepperContainer {
      display: none !important;
    }
    .mobile-simulator-wrapper #journeyStepperMobileContainer {
      display: block !important;
    }
    .mobile-simulator-wrapper #mainHeaderInner {
      padding-left: 12px !important;
      padding-right: 12px !important;
      height: 56px !important;
    }
    .mobile-simulator-wrapper #mainContentShell {
      padding: 8px 8px 16px 8px !important;
    }
    .mobile-simulator-wrapper #mainTabsHeaderBar {
      padding: 0 10px !important;
    }
    .mobile-simulator-wrapper #mainTabsBodyShell {
      padding: 10px 8px !important;
    }
    /* Desativa todos os efeitos de hover CSS no modelo Mobile */
    .mobile-simulator-wrapper .bg-aqui-grad:hover {
      filter: none !important;
      box-shadow: 0 8px 22px -10px rgba(241, 90, 34, 0.55) !important;
      transform: none !important;
    }
    .mobile-simulator-wrapper .custom-pin:hover {
      transform: none !important;
      box-shadow: 0 3px 8px rgba(18, 18, 18, 0.25) !important;
    }
    .mobile-simulator-wrapper .aqui-map-popup a.leaflet-popup-close-button:hover {
      background-color: transparent !important;
      color: #8A837B !important;
    }

    @media screen and (max-width: 768px) {
      .sim-grid-1 {
        grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
      }
      .sim-grid-1 > * {
        grid-column: 1 / -1 !important;
      }
      .sim-grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      }
      .sim-hide-mobile {
        display: none !important;
      }
      .sim-show-mobile {
        display: flex !important;
      }
      .sim-show-block-mobile {
        display: block !important;
      }
      .sim-stack-mobile {
        flex-direction: column !important;
        align-items: flex-start !important;
      }
      .sim-unsticky-mobile {
        position: static !important;
      }
      #mainHeaderInner {
        padding-left: 12px !important;
        padding-right: 12px !important;
        height: 56px !important;
      }
      #mainContentShell {
        padding: 8px 8px 16px 8px !important;
      }
      #mainTabsHeaderBar {
        padding: 6px 8px !important;
      }
      #mainTabsBodyShell {
        padding: 10px 8px !important;
      }
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Pinos do Mapa OOH */
    .custom-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      font-family: 'Rethink Sans', sans-serif;
      font-weight: 700;
      font-size: 11px;
      color: #fff;
      box-shadow: 0 3px 8px rgba(18, 18, 18, 0.25);
      border: 2px solid #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .custom-pin:hover {
      transform: scale(1.08);
      box-shadow: 0 5px 12px rgba(18, 18, 18, 0.32);
    }

    /* Popup do Mapa OOH — Reflexo do Design System dos Cards Laterais */
    .aqui-map-popup .leaflet-popup-content-wrapper {
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid #DFD7CE;
      box-shadow: 0 14px 32px -10px rgba(18, 18, 18, 0.16), 0 4px 12px -4px rgba(18, 18, 18, 0.06);
      padding: 0;
    }
    .aqui-map-popup .leaflet-popup-content {
      margin: 0;
      width: 268px !important;
      font-family: 'Atkinson Hyperlegible', 'Rethink Sans', sans-serif;
      color: #121212;
      line-height: 1.4;
    }
    .aqui-map-popup .leaflet-popup-tip {
      background: #FFFFFF;
      border: 1px solid #DFD7CE;
      box-shadow: 0 4px 10px rgba(18, 18, 18, 0.08);
    }
    .aqui-map-popup.leaflet-popup-Container a.leaflet-popup-close-button,
    .aqui-map-popup a.leaflet-popup-close-button {
      top: 12px;
      right: 12px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: #8A837B;
      font-size: 18px;
      font-weight: 400;
      padding: 0;
      line-height: 1;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .aqui-map-popup a.leaflet-popup-close-button:hover {
      background-color: #F3ECE4;
      color: #121212;
    }

    @keyframes mapCardPulse {
      0% { box-shadow: 0 0 0 0 rgba(241, 90, 34, 0.35); border-color: #F15A22; }
      70% { box-shadow: 0 0 0 6px rgba(241, 90, 34, 0); border-color: #F15A22; }
      100% { box-shadow: 0 0 0 0 rgba(241, 90, 34, 0); }
    }
    .map-synced-card-highlight {
      animation: mapCardPulse 1.6s ease-out;
      border-color: #F15A22 !important;
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 6mm 8mm 7mm 8mm;
      }
      body {
        background: #FFFFFF !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print { display: none !important; }
      #viewportWrapper { display: none !important; }
      #pdfViewportWrapper {
        display: block !important;
        padding: 0 !important;
        background: #FFFFFF !important;
      }
      .pdf-page-sheet {
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        border-radius: 0 !important;
        overflow: visible !important;
      }
      .pdf-header-kv {
        border-radius: 16px !important;
      }
      .pdf-body-content {
        padding-left: 0 !important;
        padding-right: 0 !important;
        padding-top: 10px !important;
        padding-bottom: 0 !important;
      }
      .pdf-avoid-break {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      .pdf-metrics-container {
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }
      .pdf-break-before-print {
        break-before: page !important;
        page-break-before: always !important;
        margin-top: 0 !important;
      }
      .pdf-keep-with-next {
        break-after: avoid !important;
        page-break-after: avoid !important;
      }
      thead {
        display: table-header-group;
      }
      tfoot {
        display: table-row-group;
      }
      tr {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

  <!-- BARRA DE SIMULAÇÃO DE CENÁRIOS (PROTÓTIPO) -->
  <div class="no-print sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-ds-border px-4 py-2 text-xs">
    <div class="max-w-[1360px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2">
        <span class="px-2 py-0.5 rounded-full bg-primary-light text-primary font-bold text-[11px]">Protótipo Aqui ads</span>
        <label for="scenarioSelect" class="text-ds-textSecondary font-medium">Cenário:</label>
        <select id="scenarioSelect" class="bg-ds-bg text-ds-textMain border border-ds-borderStrong rounded-lg px-2.5 py-1 font-semibold focus:outline-none focus:border-primary cursor-pointer"></select>
        <label for="proposalStatusSelect" class="text-ds-textSecondary font-medium ml-1">Status:</label>
        <select id="proposalStatusSelect" onchange="setProposalStatus(this.value)" class="bg-ds-bg text-ds-textMain border border-ds-borderStrong rounded-lg px-2.5 py-1 font-semibold focus:outline-none focus:border-primary cursor-pointer">
          <option value="awaiting">Aguardando pagamento</option>
          <option value="processing">Campanha ativa</option>
          <option value="completed">Campanha concluída</option>
        </select>
      </div>

      <div class="flex flex-wrap items-center gap-4">
        <label class="inline-flex items-center gap-1.5 cursor-pointer select-none text-ds-textSecondary hover:text-ds-textMain">
          <input type="checkbox" id="toggleCoupon" class="rounded text-primary focus:ring-primary" />
          <span>Simular Cupom (-10% OOH)</span>
        </label>

        <label class="inline-flex items-center gap-1.5 cursor-pointer select-none text-ds-textSecondary hover:text-ds-textMain">
          <input type="checkbox" id="toggleUnlogged" class="rounded text-primary focus:ring-primary" />
          <span>Simular Link Deslogado (Sem CNPJ)</span>
        </label>

        <div class="flex items-center bg-ds-bg p-0.5 rounded-lg border border-ds-borderStrong">
          <button id="btnViewDesktop" onclick="setViewportMode('desktop')" class="px-3 py-1 rounded-md font-bold bg-primary text-white transition flex items-center gap-1">
            <i class="uil uil-desktop"></i> Desktop
          </button>
          <button id="btnViewMobile" onclick="setViewportMode('mobile')" class="px-3 py-1 rounded-md font-semibold text-ds-textSecondary hover:text-ds-textMain transition flex items-center gap-1">
            <i class="uil uil-mobile-android"></i> Mobile (390px)
          </button>
          <button id="btnViewPdf" onclick="setViewportMode('pdf')" class="px-3 py-1 rounded-md font-semibold text-ds-textSecondary hover:text-ds-textMain transition flex items-center gap-1">
            <i class="uil uil-file-alt"></i> PDF Comercial
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- WRAPPER PRINCIPAL -->
  <div id="viewportWrapper" class="flex-1 w-full transition-all duration-200 no-print">

    <!-- HEADER OFICIAL AQUI ADS (COM LOGO VETORIAL EM DEGRADÊ + ENDOSSO GLOBO + ELETROMIDIA) -->
    <header class="bg-white/90 backdrop-blur-md border-b border-ds-border sticky top-[41px] z-40">
      <div id="mainHeaderInner" class="max-w-[1360px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
        <!-- Logo Oficial Aqui ads -->

          <a href="#proposalHeroSection" aria-label="Aqui ads" class="flex items-center shrink-0">
